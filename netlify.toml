# Netlify configuration for The WebCam Frontend
[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# Proxy /api requests directly to Render backend (avoids CORS and missing env issues)
[[redirects]]
  from = "/api/*"
  to = "https://the-webcam-security-system.onrender.com/api/:splat"
  status = 200
  force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


